<!doctype html>
<html lang="en" class="ss-home-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#11191d">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=1.0.53">
  <title>SideScroll</title>
</head>
<body class="modular-home ss-home ss-splash-home">
  <main class="ss-splash-shell" aria-label="SideScroll launcher">
    <img class="ss-splash-art" src="splash-screen.png?v=1.0.53" alt="" aria-hidden="true">
    <div class="ss-splash-shade" aria-hidden="true"></div>

    <button class="ss-splash-menu-button" id="ss-splash-menu-button" type="button" aria-expanded="false" aria-controls="ss-splash-menu">Menu</button>
    <nav class="ss-splash-menu" id="ss-splash-menu" hidden aria-label="Development tools">
      <a href="play.html"><strong>Edit / Test</strong><small>Scene and puzzle editor</small></a>
      <a href="asset-lab.html"><strong>Asset Lab</strong><small>Assets, collision and states</small></a>
      <a href="walk-lab.html"><strong>Walk Lab</strong><small>Character animation</small></a>
      <button class="ss-install-button ss-splash-install" id="ss-install" type="button" hidden><strong>Install SideScroll</strong><small>Add to Home Screen</small></button>
    </nav>

    <section class="ss-splash-launch" aria-label="Play SideScroll">
      <a class="ss-splash-play is-loading" id="ss-splash-play" href="play.html?mode=player" aria-disabled="true">
        <span>PLAY</span>
      </a>
      <div class="ss-preload" id="ss-preload" role="status" aria-live="polite">
        <div class="ss-preload-track"><i id="ss-preload-bar"></i></div>
        <div class="ss-preload-copy"><span id="ss-preload-label">Preparing world…</span><b id="ss-preload-percent">0%</b></div>
      </div>
    </section>
  </main>

  <div class="gh-install-overlay" id="gh-install-overlay" hidden>
    <section class="gh-install-card" role="dialog" aria-modal="true" aria-labelledby="gh-install-title">
      <button class="gh-install-close" id="gh-install-close" type="button" aria-label="Close install instructions">×</button>
      <p class="gh-install-kicker" id="gh-install-kicker">INSTALL SIDESCROLL</p>
      <h2 id="gh-install-title">Add SideScroll to your Home Screen</h2>
      <p class="gh-install-copy-text" id="gh-install-copy-text"></p>
      <div class="gh-install-steps" id="gh-install-steps"></div>
      <button class="gh-install-done" id="gh-install-done" type="button">Got it</button>
    </section>
  </div>

  <script src="site-config.js?v=1.0.53"></script>
  <script src="core.js?v=1.0.53"></script>
  <script src="home.js?v=1.0.53"></script>
</body>
</html>
