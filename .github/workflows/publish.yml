# Automatic publishing (TASKS.md step 4).
#
# Upload a Publish Lab package (SS-PUBLISH-….json), a character export or a
# Project Backup into the publish/ folder on GitHub (Add file → Upload files),
# on main or on a new branch. This workflow bakes it into the game's built-in
# content with tools/bake_project.py (the same tool a Claude session runs),
# removes the uploaded file, and opens a pull request into main. Merge the pull
# request and GitHub Pages publishes it to every player.
#
# One-off repository setting: Settings → Actions → General → Workflow
# permissions → "Read and write permissions" and "Allow GitHub Actions to
# create and approve pull requests".
name: Publish uploaded package

on:
  push:
    paths:
      - 'publish/**.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  bake:
    # Our own pull-request branches only delete files from publish/.
    if: ${{ !startsWith(github.ref_name, 'auto-publish/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect the uploaded files
        id: files
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          # Every .json in publish/ at the pushed commit (README excluded).
          git ls-tree --name-only "$PUSHED_SHA" publish/ | grep -E '\.json$' | sort > "$RUNNER_TEMP/files.txt" || true
          if [ ! -s "$RUNNER_TEMP/files.txt" ]; then
            echo "No package in publish/ — nothing to do."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r path; do
            git show "$PUSHED_SHA:$path" > "$RUNNER_TEMP/packages/$(basename "$path")"
          done < "$RUNNER_TEMP/files.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/files.txt")" >> "$GITHUB_OUTPUT"
          echo "Packages:"; cat "$RUNNER_TEMP/files.txt"

      - name: Bake into the built-in content
        if: steps.files.outputs.count != '0'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/bake_project.py "$RUNNER_TEMP"/packages/*.json 2>&1 | tee "$RUNNER_TEMP/bake.txt"
          # The saved-data migration mirrors must still agree.
          node tools/test_migrations.js 2>&1 | tail -3 | tee -a "$RUNNER_TEMP/bake.txt"
          # Packages uploaded straight to main are removed in the same pull request.
          git rm -q --ignore-unmatch publish/*.json || true

      - name: Open the pull request
        if: steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_REF: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="auto-publish/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -q -b "$branch"
          git add -A project-defaults-data.js design-doc.json assets
          git add -A publish 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "The package changes nothing that isn't already published."
            exit 0
          fi
          names=$(paste -sd ', ' "$RUNNER_TEMP/files.txt" | sed 's#publish/##g')
          git commit -q -m "Publish: $names"
          git push -q origin "$branch"
          {
            echo "Baked automatically from **$names** (uploaded to \`$PUSHED_REF\`)."
            echo
            echo "Merge to publish it to every player (GitHub Pages redeploys in about a minute)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/bake.txt"
            echo '```'
            echo
            echo "Files changed:"
            git diff --stat HEAD~1 | tail -n 15 | sed 's/^/    /'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Publish: $names" --body-file "$RUNNER_TEMP/body.md"
          # An upload branch that holds nothing but the package can go.
          if [ "$PUSHED_REF" != "main" ] && [ -z "$(git diff --name-only origin/main..."$PUSHED_SHA" | grep -v '^publish/' || true)" ]; then
            git push -q origin --delete "$PUSHED_REF" || true
          fi
